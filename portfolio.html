<!DOCTYPE html>

    <title>Portfólio - Guardião Esquadrias</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="nav-logo">
                <img src="static/img/logo.png" alt="Logo Guardião">
            </a>
            <div class="hamburger-menu" id="hamburger">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            <ul class="nav-menu" id="nav-menu">

        <div id="gallery-grid" class="gallery-grid">
            </div>

    <div id="lightbox" class="lightbox-modal">

    <footer>
